server:
  port: ${PORT:11000}

spring:
  application:
    name: spring-vectordb
  # Spring Boot 4 MongoDB connection properties moved from spring.data.mongodb.
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/myDB}

embedding:
  api:
    url: ${EMBEDDING_API_URL:http://localhost:12000}

spring.cloud.openfeign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 30000
        loggerLevel: basic

logging:
  level:
    kopo.poly: INFO
